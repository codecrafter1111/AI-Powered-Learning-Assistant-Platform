version: 'v1'

services:

  backend:
    build: ./backend
    container_name: AIlearn_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - AIlearn_net

  frontend:
    build: ./frontend
    container_name: AIlearn_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - AIlearn_net


networks:
  AIlearn_net:
    driver: bridge

